<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Time Tracker Stats</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Din Tidsstatistik</h1>
      <p>Top 20 besökta domäner</p>
    </header>
    
    <div id="loading" class="loading">Hämtar data...</div>
    <div id="error" class="error hidden">Kunde inte hämta data. Är backend igång? (php -S localhost:8000 i backend-mappen)</div>
    
    <ul id="statsList" class="hidden">
      <!-- List items injected via JS -->
    </ul>
    
    <button id="resetApp" class="hidden">Nollställ Allt</button>
    
    <footer>
      <span>Drivs av PostgreSQL + PHP</span>
    </footer>
  </div>

  <section id="timers-section">
    <h2>Timers</h2>
    <div id="timer-form">
      <input type="number" id="timer-minutes" min="1" max="1440" placeholder="Minuter">
      <button id="timer-start">Starta timer</button>
      <div id="timer-error" class="error hidden"></div>
    </div>
    <ul id="timer-list"></ul>
    <p id="no-timers" class="hidden">Inga aktiva timers.</p>
  </section>

  <script src="popup.js"></script>
</body>
</html>
